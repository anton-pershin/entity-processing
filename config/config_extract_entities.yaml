defaults:
  - _self_
  - llm: default

input: null
output: null
entity_types: [LOCATION, ORGANIZATION, PEOPLE]
relation_types: [WORK_FOR, KILL, ORGANIZATION_BASED_IN, LIVE_IN, LOCATED_IN]
sentiment_types: [POSITIVE, NEUTRAL, NEGATIVE]
system_prompt: "You extract structured entities, targeted sentiment, and local relations from documents."
user_prompt_template: |-
  {system_prompt}

  Extract entities, targeted sentiment, and local relations from the document.
  Return only a JSON object with this shape: {{"entities": [{{"entity_id": "e1", "mention": "...", "type": "...", "sentiment": "..."}}], "relations": [{{"relation_type": "...", "head": "e1", "tail": "e2"}}]}}
  Entity mentions must be exact contiguous substrings copied from the document, preserving source casing, abbreviations, and punctuation; do not normalize or paraphrase them. Do not add surrounding descriptive words or generic nouns to a named entity (for example, prefer "AP" over "AP LaserPhoto network" when AP is the named organization).
  Extract all relations that are explicitly supported by the document. Use the relation label whose meaning best matches the stated fact and preserve its direction. Do not omit a relation merely because it requires ordinary sentence-level reasoning, but do not invent relations from unrelated co-occurrence or world knowledge.
  Use only the allowed labels below.
  Allowed entity types: {entity_types}
  Allowed relation types: {relation_types}
  Allowed sentiment types: {sentiment_types}

  Document:
  {document}
retries: 3
backoff_seconds: 1.0

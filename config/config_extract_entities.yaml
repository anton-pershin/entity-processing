defaults:
  - _self_
  - llm: default

input: null
output: null
entity_types: [LOCATION, ORGANIZATION, PEOPLE]
relation_types: [WORK_FOR, KILL, ORGANIZATION_BASED_IN, LIVE_IN, LOCATED_IN]
sentiment_types: [POSITIVE, NEUTRAL, NEGATIVE]
system_prompt: "You extract structured entities, targeted sentiment, and local relations from documents."
user_prompt_template: |-
  {system_prompt}

  Extract entities, targeted sentiment, and local relations from the document.
  Return only a JSON object with this shape: {{"entities": [{{"entity_id": "e1", "mention": "...", "type": "...", "sentiment": "..."}}], "relations": [{{"relation_type": "...", "head": "e1", "tail": "e2"}}]}}
  Entity mentions must be the minimal named span copied from the document, preserving source casing and internal punctuation. Omit sentence-final punctuation (such as a trailing period or comma) unless it is part of the name; do not add surrounding descriptive words or generic nouns to a named entity (for example, prefer "AP" over "AP LaserPhoto network", and "John Stembridge" over "John Stembridge.").
  Extract all relations explicitly supported by the document, including relations expressed by ordinary wording such as "was born [place]", "reared in [place]", "native [place]", "works for [organization]", "located in [place]", and "assassin [person] ... killed [person]". Use the relation label whose meaning best matches the stated fact and preserve its direction. Do not invent relations from unrelated co-occurrence or world knowledge.
  For location relations, include each clearly stated location assignment, even when several entities share the same location. For example, "X was born Duluth and reared in Hibbing" produces LIVE_IN(X, Duluth) and LIVE_IN(X, Hibbing).
  Use only the allowed labels below.
  Allowed entity types: {entity_types}
  Allowed relation types: {relation_types}
  Allowed sentiment types: {sentiment_types}

  Document:
  {document}
retries: 3
backoff_seconds: 1.0
